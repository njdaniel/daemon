[package]
name = "dmn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon: a Linux-native interview copilot (terminal MVP)"

[[bin]]
name = "dmn"
path = "src/main.rs"

[features]
# GPU whisper backends, forwarded to dmn-stt. `dmn doctor` reports which one is compiled in.
cuda = ["dmn-stt/cuda"]
vulkan = ["dmn-stt/vulkan"]

[dependencies]
clap = { workspace = true }
dmn-audio = { path = "../../crates/dmn-audio" }
dmn-core = { path = "../../crates/dmn-core" }
dmn-stt = { path = "../../crates/dmn-stt" }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
