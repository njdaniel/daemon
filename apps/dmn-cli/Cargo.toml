[package]
name = "dmn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon: a Linux-native interview copilot (terminal MVP)"

[[bin]]
name = "dmn"
path = "src/main.rs"

[features]
# GPU whisper backends, forwarded to dmn-stt. `dmn doctor` reports which one is compiled in.
cuda = ["dmn-stt/cuda"]
vulkan = ["dmn-stt/vulkan"]

[dependencies]
clap = { workspace = true }
crossbeam-channel = { workspace = true }
dmn-audio = { path = "../../crates/dmn-audio" }
dmn-context = { path = "../../crates/dmn-context" }
dmn-core = { path = "../../crates/dmn-core" }
dmn-detect = { path = "../../crates/dmn-detect" }
dmn-llm = { path = "../../crates/dmn-llm" }
dmn-session = { path = "../../crates/dmn-session" }
dmn-stt = { path = "../../crates/dmn-stt" }
dmn-store = { path = "../../crates/dmn-store" }
dmn-transcript = { path = "../../crates/dmn-transcript" }
dmn-vad = { path = "../../crates/dmn-vad" }
ratatui = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
