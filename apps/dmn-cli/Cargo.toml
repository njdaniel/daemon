[package]
name = "dmn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon: a Linux-native interview copilot (terminal MVP)"

[[bin]]
name = "dmn"
path = "src/main.rs"

[features]
# GPU whisper backends. Forwarded to dmn-stt once it exists (#8); today they only change what
# `dmn doctor` reports.
cuda = []
vulkan = []

[dependencies]
clap = { workspace = true }
dmn-audio = { path = "../../crates/dmn-audio" }
dmn-core = { path = "../../crates/dmn-core" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
