<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daemon — Audio and model settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0f}
a{color:#5fd3a6}a:hover{color:#8ae3c1}
button,select,input{font-family:inherit}
</style>
</helmet>
<div style="width: 440px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #121417; color: #e8eaed; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.45; border: 1px solid #2a2f37; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.55);">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px 0 12px; border-bottom: 1px solid #22262d; background: #15181c; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="Main.dc.html" aria-label="Back to live view" style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; color: #9aa3ad; text-decoration: none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="font-size: 12px; font-weight: 600; color: #c6ccd3;">Settings</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #6f7883;">~/.config/dmn/config.toml</span>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: #9aa3ad;">AUDIO · PIPEWIRE</span>
      <div style="display: flex; flex-direction: column; border: 1px solid #22262d; border-radius: 8px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px; border-bottom: 1px solid #22262d;">
          <label for="mic" style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Microphone</span><span style="font-size: 11.5px; color: #9aa3ad;">Your side of the conversation</span></label>
          <select id="mic" style="height: 28px; padding: 0 8px; background: #0f1114; border: 1px solid #2a2f37; border-radius: 6px; color: #e8eaed; font-size: 12px; max-width: 170px;"><option>Built-in Audio Analog Stereo</option><option>USB Condenser Mic</option></select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px; border-bottom: 1px solid #22262d;">
          <label for="sysaudio" style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">System audio capture</span><span style="font-size: 11.5px; color: #9aa3ad;">Interviewer's voice via a PipeWire loopback node</span></label>
          <input id="sysaudio" type="checkbox" checked style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0;">
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px; border-bottom: 1px solid #22262d;">
          <label for="app" style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Capture from</span><span style="font-size: 11.5px; color: #9aa3ad;">Detected streams</span></label>
          <select id="app" style="height: 28px; padding: 0 8px; background: #0f1114; border: 1px solid #2a2f37; border-radius: 6px; color: #e8eaed; font-size: 12px; max-width: 170px;"><option>Google Meet — Firefox</option><option>Zoom</option><option>Microsoft Teams — Chromium</option><option>All application output</option></select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px;">
          <div style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Speaker separation</span><span style="font-size: 11.5px; color: #9aa3ad;">Mic = You, loopback = Interviewer. Falls back to diarization when both share one stream.</span></div>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{accent}}; flex-shrink: 0;">by source</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #22262d; border-radius: 8px; background: #15181c;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9aa3ad; width: 34px;">mic</span>
        <div style="flex-grow: 1; height: 4px; background: #22262d; border-radius: 2px; overflow: hidden;"><div style="width: 38%; height: 100%; background: {{accent}};"></div></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9aa3ad; width: 34px;">sys</span>
        <div style="flex-grow: 1; height: 4px; background: #22262d; border-radius: 2px; overflow: hidden;"><div style="width: 71%; height: 100%; background: {{accent}};"></div></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: #9aa3ad;">TRANSCRIPTION</span>
      <div style="display: flex; flex-direction: column; border: 1px solid #22262d; border-radius: 8px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px; border-bottom: 1px solid #22262d;">
          <label for="stt" style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Engine</span><span style="font-size: 11.5px; color: #9aa3ad;">Runs on this machine</span></label>
          <select id="stt" style="height: 28px; padding: 0 8px; background: #0f1114; border: 1px solid #2a2f37; border-radius: 6px; color: #e8eaed; font-size: 12px; max-width: 170px;"><option>whisper.cpp · small.en</option><option>whisper.cpp · medium.en</option><option>faster-whisper · large-v3</option></select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 12px;">
          <label for="qsens" style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Question detection</span><span style="font-size: 11.5px; color: #9aa3ad;">Higher = fewer false positives, slower to surface</span></label>
          <select id="qsens" style="height: 28px; padding: 0 8px; background: #0f1114; border: 1px solid #2a2f37; border-radius: 6px; color: #e8eaed; font-size: 12px; max-width: 170px;"><option>Balanced</option><option>Eager</option><option>Strict</option></select>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: #9aa3ad;">MODEL</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 12px; text-align: left; background: #15201c; border: 1px solid {{accent}}; border-radius: 8px; color: #e8eaed; cursor: pointer;">
          <span style="font-size: 12.5px; font-weight: 500;">Local · Ollama</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9aa3ad;">llama3.1:8b · localhost:11434</span>
          <span style="font-size: 11px; color: {{accent}};">Nothing leaves this machine</span>
        </button>
        <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 12px; text-align: left; background: transparent; border: 1px solid #2a2f37; border-radius: 8px; color: #e8eaed; cursor: pointer;">
          <span style="font-size: 12.5px; font-weight: 500;">Remote API</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9aa3ad;">OpenAI-compatible endpoint</span>
          <span style="font-size: 11px; color: #9aa3ad;">Transcript text is sent</span>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; border: 1px solid #22262d; border-radius: 8px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 12px; border-bottom: 1px solid #22262d;">
          <label for="len" style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Default answer length</label>
          <select id="len" style="height: 28px; padding: 0 8px; background: #0f1114; border: 1px solid #2a2f37; border-radius: 6px; color: #e8eaed; font-size: 12px;"><option>Concise (5 points)</option><option>Minimal (3 points)</option></select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 12px;">
          <label for="autoexp" style="font-size: 12.5px; font-weight: 500; color: #e8eaed;">Never auto-expand sections</label>
          <input id="autoexp" type="checkbox" checked style="accent-color: {{accent}}; width: 16px; height: 16px; margin: 0;">
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 12px 0 16px; border-top: 1px solid #22262d; background: #111316; flex-shrink: 0;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9aa3ad;">whisper 0.4s · llm 1.2s · e2e ≈ 2s</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #6f7883;">v0.3 · wayland</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5fd3a6","options":["#5fd3a6","#7aa2ff","#e8b04f"]},"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5fd3a6' };
  }
}
</script>
</body>
</html>
