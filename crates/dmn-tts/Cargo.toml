[package]
name = "dmn-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The scripted loopback HTTP server, for `dmn-cli`'s tests of `dmn speak` (dev-dependency only).
test-server = []

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# blocking: the decoder thread reads the WAV body through a blocking `Read`, so a slow caller
# blocks the read (backpressure) and no async runtime is needed to drain it.
reqwest = { workspace = true, features = ["blocking"] }
futures-util = { workspace = true }
crossbeam-channel = { workspace = true }
# Writes the mock's sine WAV; decoding is this crate's own (src/decode.rs says why).
hound = "3.5"
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
