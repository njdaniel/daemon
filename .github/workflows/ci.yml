name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (PipeWire headers, clang, cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev clang libclang-dev cmake pipewire-bin just
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # whisper.cpp is compiled by whisper-rs's build script (issue #8) under
      # target/*/build/whisper-rs-sys-*/. rust-cache drops build-script outputs for changed
      # crates only, but a cold cache still rebuilds whisper.cpp (~5 min). Key on the lock file
      # and the stt crate manifest so the C build survives Rust-only changes elsewhere.
      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: |
            target/debug/build/whisper-rs-sys-*
            target/release/build/whisper-rs-sys-*
          key: whisper-cpp-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/dmn-stt/Cargo.toml') }}
          restore-keys: |
            whisper-cpp-${{ runner.os }}-
      # TTS fixtures (#23) live in the private release fixtures-v1, not in git. The recipe
      # downloads with gh (authenticated by the workflow token) and checks the sha256; the cache
      # is keyed on that checksum file so a new fixture version invalidates it.
      - name: Cache fixtures
        id: fixtures
        uses: actions/cache@v4
        with:
          path: |
            testdata/*/interviewer.wav
            testdata/*/candidate.wav
          key: fixtures-${{ hashFiles('testdata/fixtures-v1.sha256') }}
      - name: Fetch fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just fixtures-fetch
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p dmn-cli -- --version
      # No PipeWire server, no Ollama, no whisper model on the runner: doctor fails by design.
      # Its output stays in the log so a broken check is visible without failing CI.
      - name: dmn doctor (informational)
        run: cargo run -p dmn-cli -- doctor || true
